plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

import groovy.json.JsonSlurper

version = project.mod_version
group = project.maven_group
def modVersion = project.version.toString()
def licenseArchiveName = project.name
def fabricNetworkingApiVersion = project.property("fabric_networking_api_version")
def fabricLifecycleEventsVersion = project.property("fabric_lifecycle_events_version")
def fabricKeyMappingApiVersion = project.property("fabric_key_mapping_api_version")
def localModMenu = file(project.modmenu_jar)

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/releases/"
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "tabnamedimmer" {
            sourceSet sourceSets.client
        }
    }
}

sourceSets {
    test {
        compileClasspath += sourceSets.client.output
        runtimeClasspath += sourceSets.client.output
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-networking-api-v1:${fabricNetworkingApiVersion}"
    implementation "net.fabricmc.fabric-api:fabric-lifecycle-events-v1:${fabricLifecycleEventsVersion}"
    implementation "net.fabricmc.fabric-api:fabric-key-mapping-api-v1:${fabricKeyMappingApiVersion}"
    if (localModMenu.isFile()) {
        compileOnly files(localModMenu)
    } else {
        compileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") {
            transitive = false
        }
    }
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
}

tasks.withType(ProcessResources).configureEach {
    inputs.property "version", modVersion

    filesMatching("fabric.mod.json") {
        expand "version": modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = "UTF-8"
    it.options.compilerArgs += ["-Xlint:deprecation"]
}

def languageFiles = fileTree("src/client/resources/assets/tabnamedimmer/lang") {
    include "*.json"
}

tasks.register("verifyLocalization") {
    group = "verification"
    description = "Checks that all supported locale files contain the same translation keys."
    inputs.files(languageFiles)

    doLast {
        def parsed = languageFiles.files.sort { it.name }.collectEntries { file ->
            [(file.name): new JsonSlurper().parse(file) as Map]
        }
        def expectedLocales = ["en_us.json", "es_es.json", "es_mx.json", "ru_ru.json"] as Set
        if (parsed.keySet() != expectedLocales) {
            throw new GradleException("Expected locale files ${expectedLocales}, found ${parsed.keySet()}")
        }
        def referenceKeys = parsed["en_us.json"].keySet()
        parsed.each { name, translations ->
            def missing = referenceKeys - translations.keySet()
            def extra = translations.keySet() - referenceKeys
            if (!missing.isEmpty() || !extra.isEmpty()) {
                throw new GradleException("Locale ${name} differs from en_us.json; missing=${missing}, extra=${extra}")
            }
        }
    }
}

tasks.named("check") {
    dependsOn tasks.named("verifyLocalization")
    dependsOn "verifyVersionSync"
    dependsOn "verifyTranslationUsage"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

def metadataFile = file("src/client/resources/fabric.mod.json")
def readmeFile = file("README.md")

tasks.register("verifyVersionSync") {
    group = "verification"
    description = "Checks that Gradle, metadata and README use the same mod version."
    inputs.files("gradle.properties", metadataFile, readmeFile)
    doLast {
        def expected = modVersion
        def metadata = metadataFile.getText("UTF-8")
        def readme = readmeFile.getText("UTF-8")
        if (!metadata.contains('\"version\": \"${version}\"')) {
            throw new GradleException("fabric.mod.json must use the Gradle version placeholder")
        }
        def badgeVersion = java.util.regex.Pattern.quote("Version-${expected}-")
        def artifactVersion = java.util.regex.Pattern.quote("tab-name-dimmer-${expected}.jar")
        if (!(readme =~ /(?i)${badgeVersion}/).find()
                || !(readme =~ /${artifactVersion}/).find()) {
            throw new GradleException("README.md is not synchronized with mod_version=${expected}")
        }
    }
}

def clientJavaFiles = fileTree("src/client/java") { include "**/*.java" }
def englishLanguageFile = file("src/client/resources/assets/tabnamedimmer/lang/en_us.json")

tasks.register("verifyTranslationUsage") {
    group = "verification"
    description = "Checks that statically referenced UI translation keys exist."
    inputs.files(clientJavaFiles, languageFiles, englishLanguageFile)
    doLast {
        def translations = new JsonSlurper().parse(englishLanguageFile) as Map
        def used = [] as Set
        def pattern = ~/(?:Component\.translatable|new KeyMapping)\(\s*"([^"]+)"/
        clientJavaFiles.files.each { source ->
            def matcher = source.getText("UTF-8") =~ pattern
            matcher.each { match ->
                def key = match[1]
                if (key.startsWith("tabnamedimmer.") && !key.endsWith(".")) {
                    used.add(key)
                }
            }
        }
        used.addAll([
                "tabnamedimmer.state.on", "tabnamedimmer.state.off",
                "tabnamedimmer.activation.hold_shift", "tabnamedimmer.activation.hold_key", "tabnamedimmer.activation.toggle_key",
                "tabnamedimmer.mode.animated_sort", "tabnamedimmer.mode.filter", "tabnamedimmer.mode.extra_hud",
                "tabnamedimmer.sort.original", "tabnamedimmer.sort.name", "tabnamedimmer.sort.ping",
                "tabnamedimmer.afk.show", "tabnamedimmer.afk.move_to_end", "tabnamedimmer.afk.hide",
                "tabnamedimmer.hud_anchor.top_left", "tabnamedimmer.hud_anchor.top_right",
                "tabnamedimmer.hud_anchor.bottom_left", "tabnamedimmer.hud_anchor.bottom_center", "tabnamedimmer.hud_anchor.bottom_right"
        ])
        def missing = used.findAll { !translations.containsKey(it) }
        if (!missing.isEmpty()) {
            throw new GradleException("Missing UI translation keys: ${missing.sort()}")
        }
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${licenseArchiveName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
}
