plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

import groovy.json.JsonSlurper

version = project.mod_version
group = project.maven_group
def modVersion = project.version.toString()
def licenseArchiveName = project.name
def minecraftVersionKey = project.minecraft_version.toString().replace('.', '_')
def fabricNetworkingApiVersion = project.property("fabric_networking_api_version_${minecraftVersionKey}")
def fabricLifecycleEventsVersion = project.property("fabric_lifecycle_events_version_${minecraftVersionKey}")
def localModMenu = file(project.modmenu_jar)

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/releases/"
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "tabnamedimmer" {
            sourceSet sourceSets.client
        }
    }
}

sourceSets {
    client {
        java {
            if (project.minecraft_version == "26.2") {
                srcDir "src/compat_26_2/java"
            } else {
                srcDir "src/compat_26_1/java"
            }
        }
    }
}



dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-networking-api-v1:${fabricNetworkingApiVersion}"
    implementation "net.fabricmc.fabric-api:fabric-lifecycle-events-v1:${fabricLifecycleEventsVersion}"
    if (localModMenu.isFile()) {
        compileOnly files(localModMenu)
    } else {
        compileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") {
            transitive = false
        }
    }
}

tasks.withType(ProcessResources).configureEach {
    inputs.property "version", modVersion

    filesMatching("fabric.mod.json") {
        expand "version": modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = "UTF-8"
    it.options.compilerArgs += ["-Xlint:deprecation"]
}

def languageFiles = fileTree("src/client/resources/assets/tabnamedimmer/lang") {
    include "*.json"
}

tasks.register("verifyLocalization") {
    group = "verification"
    description = "Checks that all supported locale files contain the same translation keys."
    inputs.files(languageFiles)

    doLast {
        def parsed = languageFiles.files.sort { it.name }.collectEntries { file ->
            [(file.name): new JsonSlurper().parse(file) as Map]
        }
        def expectedLocales = ["en_us.json", "es_es.json", "es_mx.json", "ru_ru.json"] as Set
        if (parsed.keySet() != expectedLocales) {
            throw new GradleException("Expected locale files ${expectedLocales}, found ${parsed.keySet()}")
        }
        def referenceKeys = parsed["en_us.json"].keySet()
        parsed.each { name, translations ->
            def missing = referenceKeys - translations.keySet()
            def extra = translations.keySet() - referenceKeys
            if (!missing.isEmpty() || !extra.isEmpty()) {
                throw new GradleException("Locale ${name} differs from en_us.json; missing=${missing}, extra=${extra}")
            }
        }
    }
}

tasks.named("check") {
    dependsOn tasks.named("verifyLocalization")
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${licenseArchiveName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
}
